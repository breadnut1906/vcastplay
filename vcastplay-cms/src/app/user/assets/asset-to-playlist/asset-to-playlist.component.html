<p-dialog
    header="Select Playlist"
    [(visible)]="dialog"
    [style]="{ width: '42rem', height: '500px' }"
    (onShow)="onInitializedPlaylists()"
    (onHide)="onCloseDialog()"
    modal
>
    <div class="flex flex-col gap-4 w-full h-full">
        <app-filters />
        <div class="relative flex-1">
            <p-table
                #playlistsTable
                [value]="playlists()"
                [loading]="isLoading()"
                [(selection)]="selectedPlaylists"
                dataKey="id"
                [scrollable]="true" 
                scrollHeight="flex" 
                selectionMode="multiple"
                size="small"
                stripedRows
            >
                <ng-template #header>
                    <tr>
                        <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
                        <th style="width: 26rem">Name</th>
                        <th>Created On</th>
                    </tr>
                </ng-template>
                <ng-template #body let-item>
                    <tr class="text-sm" [pSelectableRow]="item">
                        <td><p-tableCheckbox [value]="item" /></td>
                        <td>
                            <div class="flex flex-col">
                                <p class="font-semibold">{{ item.name }}</p>
                                <p class="text-xs italic">{{ item.description }}</p>
                            </div>
                        </td>
                        <td>{{ utils.onGetLastUpdatedLabel(item.updatedAt) }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
    <ng-template #footer>
        <div class="flex flex-col w-full">
            <div class="flex justify-center">
                <app-paginator [pagination]="pagination" (onPageChange)="onPageChange($event)" />
            </div>
            <div class="flex justify-end gap-2">
                <p-button (onClick)="dialog.set(false)" label="Cancel" size="small" text />
                <p-button (onClick)="onClickSave($event)" label="Save" size="small" />
            </div>
        </div>
    </ng-template>
</p-dialog>
