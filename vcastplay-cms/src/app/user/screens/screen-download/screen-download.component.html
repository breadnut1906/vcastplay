<p-dialog [(visible)]="showDownload" styleClass="w-[20rem] md:w-[40rem] h-auto select-none" modal>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 justify-center items-center">
        <div class="col-span-1 md:col-span-3 text-center text-xl font-semibold">Choose your device</div>
        <p-card class="hover:shadow-2xl">
            <a class="flex flex-col gap-6 items-center justify-center p-6 hover:cursor-pointer" href="desktop.app.txt" (click)="showLink.set(false)" download>
                <i class="pi pi-desktop text-zinc-500" style="font-size: 5rem;"></i>
                <p class="font-semibold">Desktop</p>
            </a>
        </p-card>
        <p-card class="hover:shadow-2xl">
            <div class="flex flex-col gap-6 items-center justify-center p-6 hover:cursor-pointer" (click)="onClickDownload('android')">
                <i class="pi pi-android text-lime-500" style="font-size: 5rem;"></i>
                <p class="font-semibold">Android</p>
            </div>
        </p-card>
        <p-card class="hover:shadow-2xl">
            <div class="flex flex-col gap-6 items-center justify-center p-6 hover:cursor-pointer" (click)="onClickDownload('web')">
                <i class="pi pi-globe text-blue-500" style="font-size: 5rem;"></i>
                <p class="font-semibold">Browser</p>
            </div>
        </p-card>
        @if (showLink()) {
            <div class="col-span-3">
                <p-inputgroup>
                    <input type="text" [formControl]="link" readonly pInputText fluid>
                    <p-inputgroup-addon>
                        <p-button icon="pi pi-copy" pTooltip="Copy" tooltipPosition="bottom" (onClick)="onCopyToClipboard()" text />
                        <p-button icon="pi pi-link" pTooltip="Open" tooltipPosition="bottom" (onClick)="onClickOpenLink()" text />
                    </p-inputgroup-addon>
                </p-inputgroup>
            </div>
        }
    </div>
</p-dialog>
