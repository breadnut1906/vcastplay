
<p-dialog
  header="Broadcast Message"
  [(visible)]="showBroadcast"
  styleClass="w-[50rem] h-auto"
  [resizable]="false"
  [modal]="true"
  [draggable]="false"
  (onShow)="onLoadMessages()"
>

    <p-table
        #screenBroadcastMessagesTable
        [value]="messages()"
        [(selection)]="selectedScreenBroadcastMessage"
        dataKey="id"
        [scrollable]="true" 
        scrollHeight="300px" 
        selectionMode="single"
        size="small"
        stripedRows
    >
        <ng-template #header>
            <tr>
                <th style="width: 3rem"></th>
                <th>Message</th>
                <th>Duration</th>
            </tr>
        </ng-template>
        <ng-template #body let-item>
            <tr [pSelectableRow]="item">
                <td>
                    <div class="text-center"><p-tableRadioButton [value]="item" /></div>
                </td>
                <td><p class="line-clamp-1">{{ item.message }}</p></td>
                <td><p class="line-clamp-1">{{ item.duration }}</p></td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="3" [height]="20">
                    <div class="flex justify-center p-5"><p class="italic">No Data found</p></div>
                </td>
            </tr>
        </ng-template>
    </p-table>
    <ng-template #footer>
        <p-button label="Close" severity="secondary" (onClick)="onClickCloseDialog()" />
        <p-button label="Send"  (onClick)="onClickSendBroadcast()" />
    </ng-template>
</p-dialog>
