<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 backdrop-blur-sm">
    <div class="max-w-2xl w-full mx-4 rounded-2xl bg-gray-900 text-white shadow-2xl border border-red-500">
    <!-- Header -->
    <div class="flex items-center gap-4 px-6 py-4 border-b border-gray-700">
        <i class="pi {{ broadcast.icon }} text-3xl text-red-400"></i>
        <div>
            <p class="text-sm uppercase tracking-widest text-red-400">
                {{ broadcast.category }}
            </p>
            <h2 class="text-xl font-semibold">
                {{ broadcast.name }}
            </h2>
        </div>
    </div>

    <!-- Content -->
    <div class="px-6 py-6 space-y-4">
        <h1 class="text-2xl font-bold text-red-300">{{ broadcast.title }}</h1>

        <p class="text-gray-300">{{ broadcast.description }}</p>

        <div class="rounded-lg bg-red-500/10 border border-red-500/30 p-4">
            <p class="text-red-200 font-medium">
                {{ broadcast.message }}
            </p>
        </div>
    </div>
    </div>
</div>
